# HTTP Redirect
server {
    listen 80;
    server_name ${SITE_DOMAIN} www.${SITE_DOMAIN};
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__HOST____REQUEST_URI__;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl;
    server_name ${SITE_DOMAIN} www.${SITE_DOMAIN};
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/${SITE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SITE_DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    location / {
        proxy_pass http://${SITE_CONTAINER}:${SITE_PORT};
        proxy_set_header Host __HTTP_HOST__;
        proxy_set_header X-Real-IP __REMOTE_ADDR__;
        proxy_set_header X-Forwarded-For __PROXY_ADD_X_FORWARDED_FOR__;
    }
}
